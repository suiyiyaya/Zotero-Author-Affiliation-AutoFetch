name: Build Zotero plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check src/main.js
      - name: Validate plugin manifest
        run: |
          node -e "const m=require('./manifest.json'); if(m.manifest_version!==2 || !m.applications?.zotero?.id || !m.applications.zotero.update_url || !m.applications.zotero.strict_min_version || m.applications.zotero.strict_max_version!=='10.0.*') process.exit(1); if(!m.applications.zotero.update_url) process.exit(1); console.log('Manifest OK:', m.version, m.applications.zotero.strict_max_version, 'update_url present')"
      - name: Package XPI
        run: |
          zip -r Zotero-Author-Affiliation-AutoFetch.xpi manifest.json bootstrap.js src locale README.md LICENSE
          unzip -t Zotero-Author-Affiliation-AutoFetch.xpi
          unzip -p Zotero-Author-Affiliation-AutoFetch.xpi manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const m=JSON.parse(s);if(m.version!=='0.2.4'||m.applications.zotero.strict_max_version!=='10.0.*')process.exit(1);if(!m.applications.zotero.update_url)process.exit(1);console.log('Packaged XPI manifest OK')})"
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zotero-Author-Affiliation-AutoFetch-xpi
          path: Zotero-Author-Affiliation-AutoFetch.xpi
      - name: Attach XPI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Zotero-Author-Affiliation-AutoFetch.xpi
