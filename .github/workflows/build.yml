name: Build Zotero plugin

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check bootstrap.js
          node --check src/main.js
      - name: Package XPI
        run: zip -r Zotero-Author-Affiliation-AutoFetch.xpi manifest.json bootstrap.js src README.md LICENSE
      - name: Upload XPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zotero-Author-Affiliation-AutoFetch-xpi
          path: Zotero-Author-Affiliation-AutoFetch.xpi
      - name: Attach XPI to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Zotero-Author-Affiliation-AutoFetch.xpi
